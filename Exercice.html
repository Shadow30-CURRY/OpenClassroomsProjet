<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> LOGIN FORM </title>
	<link rel="stylesheet" type="text/css" href="Exercice.css">
</head>

<body>
	<div class="container">
		<div class="wrapper">
			<section class="login">
				<h2>LOGIN</h2>
				<form>
					<div class="inputBox">
						<ion-icon name="mail"></ion-icon>
						<input type="e-mail" name="" placeholder=" " required>
						<label for=""> E-MAIL</label>
					</div>
					<div class="inputBox">
						<ion-icon name="lock-closed"></ion-icon>
						<input type="password" name="" placeholder=" " required>
						<label for="">MOT DE PASSE</label>
					</div>
					<div class="forget">
						<input type="checkBox" name="">
						<a href="">Mot de passe oublié?</a>
					</div>
					<button>CONNEXION</button>
					<div class="register">
						<span>
							pas de compte?
						</span>
						<a href="" id="switch-to-sign" class="submit">Inscrivez-vous</a>
					</div>
				</form> 
			</section> 
			<section class="sign">
				<h2>Inscription</h2>
				<form>
					<div class="inputBox">
						<ion-icon name="person-sharp"></ion-icon>
						<input type="nom" name="" placeholder=" " required>
						<label for=""> NOM</label>
					</div>
					<div class="inputBox">
						<ion-icon name="mail"></ion-icon>
						<input type="e-mail" name="" placeholder=" " required>
						<label for="">E-MAIL</label>
					</div>
					<div class="inputBox">
						<ion-icon name="key"></ion-icon>
						<input type="password" name="" placeholder=" " required>
						<label for="">creer mot de paase</label>
					</div>
					<button>INSCRIPTION</button>
					<div class="register">
						<span>
							deja un compte?
						</span>
						<a href="" id="switch-to-login" class="submit">connectez-vous</a>
					</div>
				</form> 
			</section> 
		</div>
	
	</div>
	<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
	<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
	<script src="Exercice.js"></script>
</body>
</html>
